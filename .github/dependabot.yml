version: 2

updates:
  # Everything here is a devDependency — nothing ships in the extension — so the
  # risk is to the build, not to users. Grouped into one PR a week rather than
  # five, because a stream of single-bump PRs stops being read.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # TypeScript 7 is a hard stop, not a chore: typescript-eslint refuses to
      # load against it and takes the whole type-aware lint step with it. `tsc`
      # itself is already happy on 7, so this comes off the moment the plugin
      # ships support — https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: ["7.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
