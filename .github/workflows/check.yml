name: check

# Third-party actions are pinned to a commit, not a tag: a tag can be moved to
# point at different code, and `release.yml` builds the archive that goes to the
# store. The trailing comment is the version that commit was; Dependabot updates
# both together.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Before `check`, because check-manifest verifies that everything the
      # manifest points at exists in the built output.
      - run: npm run build

      - run: npm run check

      - run: node scripts/check-size.mjs

      # So a reviewer can load the extension from the PR rather than building
      # it, which is what CONTRIBUTING.md promises.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
