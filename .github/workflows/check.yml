name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      # Before `check`, because check-manifest verifies that everything the
      # manifest points at exists in the built output.
      - run: npm run build

      - run: npm run check

      - run: node scripts/check-size.mjs

      # So a reviewer can load the extension from the PR rather than building
      # it, which is what CONTRIBUTING.md promises.
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
