name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # Checked before anything else, so a mislabelled tag costs seconds rather
      # than a rejected store upload.
      - name: Tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./src/static/manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match manifest version $manifest"
            exit 1
          fi

      - run: npm ci

      # build, check, size budget and the store zip, in that order.
      - run: npm run package

      - name: Attach the store zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.zip --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" release/*.zip --clobber
